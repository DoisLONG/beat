[project]
name = "webcrawler"
version = "0.1.0"
description = "web links crawler for EAP KB setup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.18",
    "beautifulsoup4>=4.13.4",
    "crawlee[all]>=0.6.9",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.20",
    "requests>=2.32.3",
    "uvicorn>=0.34.2",
]
