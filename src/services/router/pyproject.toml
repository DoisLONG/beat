[project]
name = "router"
version = "2.0.0b"
description = "EAP router service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.18",
    "docarray==0.40.0",
    "dotenv>=0.9.9",
    "fastapi>=0.115.12",
    "httpx==0.27.2",
    "kubernetes==30.1.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-exporter-otlp==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "pillow==10.4.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "shortuuid==1.0.13",
    "uvicorn>=0.34.0",
    "opea-cores",
]

[tool.uv.sources]
opea-cores = { path = "../../libs/" }