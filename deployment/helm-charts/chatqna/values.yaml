replicaCount: 1

ENABLE_RERANK: true
image:
  repository: ekba/router
  # Uncomment the following line to set desired image pull policy if needed, as one of Always, IfNotPresent, Never.
  # pullPolicy: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault

port: 8888
service:
  type: ClusterIP
  port: 8888

nodeSelector: {}

tolerations: []

affinity: {}

# This is just to avoid Helm errors when HPA is NOT used
# (use hpa-values.yaml files to actually enable HPA).
autoscaling:
  enabled: false

# Optional subcharts enablement and subcharts settings overwritten
vllm:
  enabled: false
  LLM_MODEL_ID: meta-llama/Meta-Llama-3-8B-Instruct
  shmSize: 128Gi
  VLLM_TORCH_PROFILER_DIR: "/tmp/vllm_profile"
embedding:
  enabled: false
reranking:
  enabled: false
llm-uservice:
  enabled: false
  LLM_ENDPOINT: http://10.239.75.254:30088
  LLM_MODEL_ID: "/weights/DeepSeek-R1-Distill-Qwen-32B"
embedding-usvc:
  enabled: false
reranking-usvc:
  enabled: false
retriever-usvc:
  enabled: false
chathistory-usvc:
  enabled: false
data-prep:
  enabled: false
  DATAPREP_BACKEND: "MILVUS"
chatqna-ui:
  enabled: false
  containerPort: "80"
  service:
    type: NodePort
    nodePort: 32589
milvus:
  enabled: false
  cluster:
    enabled: false
  etcd:
    replicaCount: 1
  pulsar:
    enabled: false
  minio:
    mode: standalone
mongodb:
  enabled: false
mysql:
  enabled: false
redis-db:
  enabled: false
kbminio:
  enabled: false
  persistence:
    existingClaim: datafiles
  service:
    port: "9100"
  consoleService:
    port: "9101"
  mode: "standalone"
  replicas: 1
  resources:
    requests:
      memory: 2Gi

# Uncomment the following lines
global:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  REGISTRY: ""
  imageVersion: ""
  # Experimental REGISTRY, used as prefix to repository image
  # Only chatquan-ui enabled for now
  # REGISTRY: "localhost:5000/"
  HUGGINGFACEHUB_API_TOKEN: "insert-your-huggingface-token-here"
  # service account name to be shared with all parent/child charts.
  # If set, it will overwrite serviceAccount.name.
  # If set, and serviceAccount.create is false, it will assume this service account is already created by others.
  sharedSAName: "chatqna"
  # set modelUseHostPath or modelUsePVC to use model cache.
  modelUseHostPath: ""
  # modelUseHostPath: /mnt/opea-models
  # modelUsePVC: model-volume

  # Install Prometheus serviceMonitors for service components
  monitoring: false

  # Prometheus Helm install release name needed for serviceMonitors
  prometheusRelease: prometheus-stack
