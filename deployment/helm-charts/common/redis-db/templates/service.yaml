apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-db.fullname" . }}
  labels:
    {{- include "redis-db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
      {{- range .Values.service.ports }}
      - port: {{ .port }}
        targetPort: {{ .targetPort }}
        protocol: {{ .protocol }}
        name: {{ .name }}
      {{- end }}
  selector:
    {{- include "redis-db.selectorLabels" . | nindent 4 }}
