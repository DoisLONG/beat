# Default values for retriever-usvc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Set it as a non-null string, such as true, if you want to enable logging.
LOG_LEVEL: ""

# Uncomment and set the following settings to use Milvus as vector-DB backend
RETRIEVER_BACKEND: "MILVUS"
MILVUS_HOST: ""
MILVUS_PORT: 19530
# COLLECTION_NAME: "rag_milvus"

# retriever-usvc can do embedding locally or talk to remote TEI service to do embedding.
# TEI_EMBEDDING_ENDPOINT takes precedence over LOCAL_EMBEDDING_MODEL.
# text embedding inference service URL, e.g. http://<service-name>:<port>
TEI_EMBEDDING_ENDPOINT: ""
# local embedding model
LOCAL_EMBEDDING_MODEL: ""

kbsinfo: kbsinfo
EMBEDDING_RERANKER_BACKEND: ovms
OVMS_EMBEDDING_ENDPOINT: ""
OVMS_EMBEDDING_MODEL: "BAAI/bge-large-zh-v1.5"
embedding_ctx_length: 510
image:
  repository: ekba/retriever-new
  # Uncomment the following line to set desired image pull policy if needed, as one of Always, IfNotPresent, Never.
  # pullPolicy: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

  #securityContext:
  #  # NOTE: many dependent python modules(e.g. numpy, mpl, haystack, etc.) need to write to local disk
  #  readOnlyRootFilesystem: false
  #  allowPrivilegeEscalation: false
  #  runAsNonRoot: true
  #  runAsUser: 1000
  #  capabilities:
  #    drop:
  #    - ALL
  #  seccompProfile:
  #    type: RuntimeDefault

port: 7001
service:
  type: ClusterIP
  # The default port for retriever service is 7000
  port: 7000

resources:
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

readinessProbe:
  httpGet:
    path: v1/health_check
    port: retriever-usvc
  initialDelaySeconds: 5
  periodSeconds: 5
startupProbe:
  httpGet:
    path: v1/health_check
    port: retriever-usvc
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 120

nodeSelector: {}

tolerations: []

affinity: {}

global:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  HUGGINGFACEHUB_API_TOKEN: "insert-your-huggingface-token-here"
  # service account name to be shared with all parent/child charts.
  # If set, it will overwrite serviceAccount.name.
  # If set, and serviceAccount.create is false, it will assume this service account is already created by others.
  sharedSAName: ""

  # Install Prometheus serviceMonitor for service
  monitoring: false

  # Prometheus Helm install release name for serviceMonitor
  prometheusRelease: prometheus-stack

# For CI tests only
embedding:
  enabled: false
milvus:
  enabled: false
redis-vector-db:
  enabled: false
