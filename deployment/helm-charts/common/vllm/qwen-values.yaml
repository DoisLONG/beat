accelDevice: "gaudi"

image:
  # repository: opea/vllm-gaudi
  # tag: 1.2.1
  repository: gar-registry.caas.intel.com/ekba/vllm-gaudi
  tag: dsr1-0320
service:
  type: NodePort
  nodePort: 30088
shmSize: 64Gi
LLM_MODEL_ID: /weights/DeepSeek-R1-Distill-Qwen-32B
# VLLM_CPU_KVCACHE_SPACE: "40"
OMPI_MCA_btl_vader_single_copy_mechanism: none
VLLM_SKIP_WARMUP: true
PT_HPU_ENABLE_LAZY_COLLECTIVES: true

VLLM_PERFORMANCE_TUNED: true
PT_HPU_RECIPE_CACHE_CONFIG: "/data/cache_recipes"
VLLM_PROFILER_ENABLED: ""
VLLM_PROFILE_FILE: ""
VLLM_ZERO_PADDING: "true"
VLLM_PROMPT_USE_FUSEDSDPA: "true"

TOKENIZERS_PARALLELISM: true
PT_HPU_WEIGHT_SHARING: "0"
VLLM_MLA_DISABLE_REQUANTIZATION: "1"
RAY_IGNORE_UNHANDLED_ERRORS: "1"
VLLM_RAY_DISABLE_LOG_TO_DRIVER: "1"
VLLM_GRAPH_RESERVED_MEM: "0.2"
VLLM_GRAPH_PROMPT_RATIO: "0.8"
VLLM_EP_SIZE: "8"
VLLM_MOE_N_SLICE: "4"

VLLM_PROMPT_BS_BUCKET_MIN: "1"
VLLM_PROMPT_BS_BUCKET_STEP: "1"
VLLM_PROMPT_BS_BUCKET_MAX: "8"
VLLM_PROMPT_SEQ_BUCKET_MIN: "128"
VLLM_PROMPT_SEQ_BUCKET_STEP: "128"
VLLM_PROMPT_SEQ_BUCKET_MAX: "1152"
VLLM_DECODE_BS_BUCKET_MIN: "1"
VLLM_DECODE_BS_BUCKET_STEP: "1"
VLLM_DECODE_BS_BUCKET_MAX: "8"
VLLM_DECODE_BLOCK_BUCKET_MIN: "8"
VLLM_DECODE_BLOCK_BUCKET_STEP: "8"
VLLM_DECODE_BLOCK_BUCKET_MAX: "200"

extraCmdArgs: [
  "--trust-remote-code",
  "--tensor-parallel-size", "4",
  "--dtype", "auto",
  "--block-size", "128",
  "--max-num-seqs", "8",
  "--max-num-batched-tokens", "65536",
  "--max-model-len", "36874",
  "--max-seq-len-to-capture", "4096",
  "--disable-log-requests",
  "--use-v2-block-manager",
  "--use-padding-aware-scheduling",
  "--num-scheduler-steps", "1",
  "--distributed_executor_backend", "mp",
  "--gpu-memory-utilization", "0.9"
  ]

resources:
  limits:
    habana.ai/gaudi: 4
global:
  modelUseHostPath: /data/models
