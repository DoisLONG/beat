## common 3rd-party backend services:
#
# share:
#   - minio
#   - milvus(+etcd)
# rag stack:
#   - mongodb

services:
  mongodb:
    image: mongo:7.0.11
    container_name: eap-common-mongodb
    restart: unless-stopped
    command: --wiredTigerCacheSizeGB 1

    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: quay.io/minio/minio:RELEASE.2023-12-20T01-00-02Z
    container_name: eap-common-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0.39
    container_name: eap-common-mysql
    restart: unless-stopped
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --authentication-policy=caching_sha2_password
      --tls_version="TLSv1.2,TLSv1.3"
      --host-cache-size=0

    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql
    environment:
      - MYSQL_ROOT_PASSWORD=Eap@dfxw2025
      - MYSQL_ROOT_HOST=%
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - MYSQL_INITDB_SKIP_TZINFO=yes
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-uroot", "-pEap@dfxw2025"]
      interval: 10s
      timeout: 10s
      retries: 3

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: eap-common-milvus-etcd
    restart: unless-stopped
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

    volumes:
      - etcd-data:/etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.5.10
    container_name: eap-common-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined

    ports:
      - "19530:19530"
      - ${MILVUS_CONSOLE_PORT:-19091}:9091
    volumes:
      - milvus-data:/var/lib/milvus
      - ./config/milvus.yaml:/milvus/configs/milvus.yaml
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - "etcd"
      - "minio"

  redis:
    image: redis:8.0.2
    container_name: eap-common-redis
    restart: unless-stopped
    command:
      - redis-server
      - "--requirepass"
      - "Eap@dfxw2025"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--notify-keyspace-events"
      - "Ex"
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "Eap@dfxw2025", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 3


networks:
  default:
    name: eap-network
    driver: bridge

volumes:
  etcd-data:
    driver: local
  milvus-data:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  mongo-data:
    driver: local
